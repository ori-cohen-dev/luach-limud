<meta name="description" content="בוחרים מה להספיק – תנ״ך, משניות, ש״ס בבלי, רמב״ם או שולחן ערוך – ועד מתי, ומקבלים לוח לימוד יומי מחושב.">

<style>

@font-face{font-family:'Assistant';font-style:normal;font-display:swap;font-weight:400;src:url(fonts/assistant-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Assistant';font-style:normal;font-display:swap;font-weight:600;src:url(fonts/assistant-hebrew-600-normal.woff2) format('woff2');unicode-range:U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F}

@font-face{font-family:'Assistant';font-style:normal;font-display:swap;font-weight:700;src:url(fonts/assistant-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

<style>
/* Layout: one narrow column. Screens: my plans → choose what to finish → choose the date → the board (today card, progress, week list). */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1C2421; --muted:#5E6B66; --line:#D9E0DC; --accent:#1F5A73; --ok:#2F7A4C; --warn:#A5482F;
  --c-tanakh:#8A6420; --s-tanakh:#F4ECDD; --c-nach:#6B4A7E; --s-nach:#EFE8F3; --c-mish:#1F5A73; --s-mish:#E2EEF3;
  --c-bavli:#43602F; --s-bavli:#E8EFE2; --c-rambam:#8A3B3B; --s-rambam:#F5E7E5; --c-sa:#2D5E62; --s-sa:#E0EDED;
  --display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --body:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1C2320; --ink:#E7ECE9; --muted:#9AA8A2; --line:#2E3834; --accent:#7DB8D2; --ok:#6CC08C; --warn:#E08A70;
  --c-tanakh:#D9AE62; --s-tanakh:#3A2F1C; --c-nach:#C4A6D6; --s-nach:#2F2438; --c-mish:#7DB8D2; --s-mish:#1E3440;
  --c-bavli:#9CC27E; --s-bavli:#25321D; --c-rambam:#E39A92; --s-rambam:#3A2220; --c-sa:#7FC4C6; --s-sa:#1C3334; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1C2320; --ink:#E7ECE9; --muted:#9AA8A2; --line:#2E3834; --accent:#7DB8D2; --ok:#6CC08C; --warn:#E08A70;
  --c-tanakh:#D9AE62; --s-tanakh:#3A2F1C; --c-nach:#C4A6D6; --s-nach:#2F2438; --c-mish:#7DB8D2; --s-mish:#1E3440;
  --c-bavli:#9CC27E; --s-bavli:#25321D; --c-rambam:#E39A92; --s-rambam:#3A2220; --c-sa:#7FC4C6; --s-sa:#1C3334; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.chip,.chk,.pick-head,.plan,.tabbar,.track .lbl,.stat,summary{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.wrap.enter>*{animation:rise .28s ease-out both}
.wrap.enter>*:nth-child(2){animation-delay:.03s}.wrap.enter>*:nth-child(3){animation-delay:.06s}.wrap.enter>*:nth-child(4){animation-delay:.09s}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap.has-tabbar{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.05)}
.tabbar button{font:inherit;font-size:.78rem;font-weight:600;color:var(--muted);background:none;border:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:52px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--accent)}
.tabbar button[aria-current="true"] svg{background:var(--s-mish);border-radius:999px;padding:2px 14px;box-sizing:content-box}
.tabbar button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.chk:checked{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.wrap.enter>*,.chk:checked{animation:none}}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
.sub{color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:.92rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:6px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:focus-visible,.chip:focus-visible,.pick:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:.88rem;color:var(--muted);min-height:1.2em}
.notice{font-size:.9rem;background:var(--s-tanakh);color:var(--ink);border-radius:10px;padding:10px 14px}

/* plan list */
.plans{display:flex;flex-direction:column;gap:10px}
.plan{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:start;font:inherit;color:inherit}
.plan h3{min-width:0}
.plan .pct{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2}
.plan .tags{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc);margin-inline-end:4px;vertical-align:middle}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* wizard */
.steps{font-size:.82rem;color:var(--muted);letter-spacing:.04em;font-weight:700}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pick{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pick.on{border-color:var(--tc);background:linear-gradient(var(--ts),var(--ts)) padding-box}
.pick-head{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:start;width:100%}
.pick-head h3{color:var(--tc)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--tc);flex:none;display:grid;place-items:center}
.pick.on .tick{background:var(--tc)}
.pick.on .tick::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pick .desc{font-size:.9rem;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.opts[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
select,input[type=date],input[type=text]{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px;max-width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.preview{display:flex;flex-direction:column;gap:10px}
.pv{border-inline-start:3px solid var(--tc);padding-inline-start:12px;display:flex;flex-direction:column;gap:2px}
.pv b{color:var(--tc)}
.pv .big{font-family:var(--display);font-size:1.15rem}
.pv small{color:var(--muted);font-size:.86rem}
.sum{font-size:.95rem}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}

/* board */
.today{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.daynum{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--ts)}
.track>div{min-width:0}
.track .lbl{font-size:.78rem;letter-spacing:.04em;font-weight:700;color:var(--tc)}
.track .what{font-family:var(--display);font-size:1.2rem;font-weight:500;overflow-wrap:anywhere}
.track .meta{font-size:.88rem;color:var(--muted)}
.track.rest .what{font-family:var(--body);font-size:1rem;color:var(--muted)}
.chk{appearance:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--tc,var(--muted));background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;margin:0}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:12px;height:20px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-2px,-2px)}
.chk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chk:disabled{cursor:default;opacity:.55}
.mlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mlinks:empty{display:none}
.openbtn{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;font-weight:600;color:var(--tc);background:var(--surface);border:1px solid var(--tc);border-radius:999px;padding:6px 13px;min-height:34px;text-decoration:none}
.openbtn:hover{background:var(--tc);color:var(--surface)}
.openbtn:focus-visible{outline:3px solid var(--tc);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px 10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.35rem;font-variant-numeric:tabular-nums;color:var(--tc,var(--ink))}
.stat span{font-size:.8rem;color:var(--muted)}
button.stat{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:start;cursor:pointer;border-radius:8px;outline:1px dashed var(--warn);outline-offset:4px}
button.stat b{color:var(--warn)}
button.stat:focus-visible{outline:3px solid var(--warn)}
button.stat span::after{content:" ←"}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav h3{font-size:1.05rem;text-align:center}
.days{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:4.4rem 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.day.is-today{background:linear-gradient(to left,var(--s-mish),transparent)}
.day .when{font-size:.82rem;color:var(--muted);line-height:1.3;padding-top:4px}
.day .when b{display:block;color:var(--ink);font-size:.95rem}
.day.missed .when b{color:var(--warn)}
.lines{display:flex;flex-direction:column;gap:6px;min-width:0}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.line>span{min-width:0;overflow-wrap:anywhere;font-size:.95rem}
.line .k{font-size:.74rem;font-weight:700;color:var(--tc);margin-inline-end:6px;letter-spacing:.03em}
.line.rest>span{color:var(--muted)}
.line .chk{width:30px;height:30px}
.lk{display:inline-grid;place-items:center;min-width:26px;height:26px;margin-inline-start:4px;border-radius:50%;border:1px solid var(--tc);color:var(--tc);text-decoration:none;font-size:.8rem;line-height:1;vertical-align:middle}
.lk:hover{background:var(--tc);color:var(--surface)}
.lk:focus-visible{outline:3px solid var(--tc);outline-offset:2px}
.line .chk:checked::after{width:7px;height:13px;border-width:0 2.5px 2.5px 0}
.day.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{background:var(--s-tanakh);box-shadow:0 0 0 2px var(--warn) inset}100%{box-shadow:0 0 0 2px transparent inset}}
@media (prefers-reduced-motion:reduce){.day.flash{animation:none;background:var(--s-tanakh)}}
details{color:var(--muted);font-size:.9rem}
.remind{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink);font-size:.95rem}
.remind[open]{display:flex;flex-direction:column;gap:12px}
.remind summary{display:flex;align-items:center;gap:8px}
.remind summary svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.remind p{color:var(--muted);font-size:.88rem}
.remind .row{gap:10px}
.remind input[type=time]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
details ul{padding-inline-start:18px;margin:8px 0 0}
summary{cursor:pointer;color:var(--ink);font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.backup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.backup[open]{display:flex;flex-direction:column;gap:10px}
.backup p{color:var(--muted)}
.backup textarea{font:inherit;font-size:.85rem;width:100%;min-height:84px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink);direction:ltr}
@media (max-width:420px){.day{grid-template-columns:3.6rem 1fr}.track .what{font-size:1.08rem}}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="he" id="app">
  <p class="sub">טוען…</p>

function buildUnits(kind,o,N){
  const u=[];
  if(kind==='torah'&&N&&N>187){
    T.TORAH_V.forEach((ch,i)=>ch.forEach((n,ci)=>{for(let v=1;v<=n;v++) u.push({b:i,c:ci+1,v,w:1})}));
  } else if(kind==='tanakh'||kind==='torah'||kind==='nach'){
    const a=kind==='torah'?0:kind==='nach'?5:(o.from||0), b=kind==='torah'?5:39;
    for(let i=a;i<b;i++) for(let c=1;c<=T.TANAKH[i][2];c++) u.push({b:i,c,w:1});
  } else if(kind==='mishnah'){
    for(let i=o.from||0;i<T.MISHNAH.length;i++) T.MISHNAH[i][2].forEach((n,ci)=>{for(let m=1;m<=n;m++) u.push({b:i,c:ci+1,m,w:1})});
  } else if(kind==='bavli'){
    const am=[];
    for(let i=o.from||0;i<T.BAVLI.length;i++){const [,,d,s,n]=T.BAVLI[i]; for(let a=0;a<n;a++) am.push({b:i,x:d*2+s+a});}
    const dafs=[]; for(const a of am){const l=dafs[dafs.length-1]; if(l&&l.b===a.b&&(l.x0>>1)===(a.x>>1)){l.x1=a.x;l.w++} else dafs.push({b:a.b,x0:a.x,x1:a.x,w:1});}
    if(N && N>dafs.length) return am.map(a=>({b:a.b,x0:a.x,x1:a.x,w:1}));
    return dafs;
  } else if(kind==='rambam'){
    for(let i=o.from||0;i<T.RAMBAM.length;i++) for(let c=1;c<=T.RAMBAM[i][2];c++) u.push({b:i,c,w:1});
  } else if(kind==='sa'){
    const parts=(o.parts&&o.parts.length)?o.parts:[0,1,2,3];
    for(const p of [0,1,2,3]) if(parts.includes(p)) for(let c=1;c<=T.SA[p][3];c++) u.push({b:p,c,w:1});
  }
  return u;
}
function totalWeight(kind,o,N){return buildUnits(kind,o,N||0).reduce((a,x)=>a+x.w,0)}
function alloc(ws,N){
  const cum=[];let c=0;for(const w of ws){c+=w;cum.push(c)}
  const W=c,res=[];let s=0;
  for(let i=0;i<N;i++){
    let e;
    if(i===N-1) e=ws.length-1;
    else{
      const t=W*(i+1)/N; e=s-1;
      while(e+1<ws.length&&cum[e+1]<=t+1e-9) e++;
      if(e+1<ws.length){const below=e>=0?cum[e]:0; if(cum[e+1]-t<t-below) e++;}
    }
    if(e<s) res.push(null); else {res.push([s,e]); s=e+1;}
  }
  return res;
}
const amud=x=>gem(x>>1)+(x&1?' ע״ב':' ע״א');
function describe(kind,us){
  const a=us[0],z=us[us.length-1],w=us.reduce((s,x)=>s+x.w,0);
  const books=[]; for(const x of us){const l=books[books.length-1]; if(l&&l.b===x.b) l.z=x; else books.push({b:x.b,a:x,z:x});}
  let text='',meta='',links=[];
  const range=(p,q)=>p===q?p:p+' – '+q;
  if(a.v){
    const nm=i=>T.TANAKH[i][0], r=x=>gem(x.c)+','+gem(x.v);
    text=a.b===z.b?nm(a.b)+' '+range(r(a),r(z)):nm(a.b)+' '+r(a)+' – '+nm(z.b)+' '+r(z);
    meta=(w===1?'פסוק אחד':w+' פסוקים')+' · תורה';
    links=books.map(g=>{const end=g.z.c===g.a.c?(g.z.v===g.a.v?'':'-'+g.z.v):'-'+g.z.c+'.'+g.z.v;
      return {label:nm(g.b),url:sef(T.TANAKH[g.b][1]+'.'+g.a.c+'.'+g.a.v+end)}});
  } else if(kind==='tanakh'||kind==='torah'||kind==='nach'){
    const nm=i=>T.TANAKH[i][0];
    text=a.b===z.b?nm(a.b)+' '+(a.c===z.c?gem(a.c):gem(a.c)+'–'+gem(z.c)):nm(a.b)+' '+gem(a.c)+' – '+nm(z.b)+' '+gem(z.c);
    meta=(w===1?'פרק אחד':w+' פרקים')+' · '+TSEC[T.TANAKH[a.b][3]];
    links=books.map(g=>({label:nm(g.b),url:sef(T.TANAKH[g.b][1].replace(/ /g,'_')+'.'+g.a.c+(g.z.c!==g.a.c?'-'+g.z.c:''))}));
  } else if(kind==='mishnah'){
    const nm=i=>T.MISHNAH[i][0], r=x=>gem(x.c)+','+gem(x.m);
    text=a.b===z.b?nm(a.b)+' '+range(r(a),r(z)):nm(a.b)+' '+r(a)+' – '+nm(z.b)+' '+r(z);
    meta=(w===1?'משנה אחת':w+' משניות')+' · סדר '+SEDER[T.MISHNAH[a.b][3]];
    links=books.map(g=>{const k=T.MISHNAH[g.b][1],pre=k==='Avot'?'Pirkei_Avot':'Mishnah_'+k;
      const end=g.z.c===g.a.c?(g.z.m===g.a.m?'':'-'+g.z.m):'-'+g.z.c+'.'+g.z.m;
      return {label:nm(g.b),url:sef(pre+'.'+g.a.c+'.'+g.a.m+end)}});
  } else if(kind==='bavli'){
    const nm=i=>T.BAVLI[i][0], fine=us.every(x=>x.x0===x.x1), q=a.x0, r=z.x1;
    const pt=(x,isEnd)=>{ if(!fine) return gem(x>>1); return amud(x); };
    if(a.b===z.b){
      if((q>>1)===(r>>1)) text=nm(a.b)+' '+(q===r?amud(q):gem(q>>1));
      else if(fine&&!(q&1)&&(r&1)) text=nm(a.b)+' '+gem(q>>1)+'–'+gem(r>>1);
      else text=nm(a.b)+' '+(fine?amud(q)+' – '+amud(r):gem(q>>1)+'–'+gem(r>>1));
    } else text=nm(a.b)+' '+pt(q)+' – '+nm(z.b)+' '+pt(r);
    const dafs=w/2; meta=(w===1?'עמוד אחד':dafs===1?'דף אחד':(Number.isInteger(dafs)?dafs:dafs.toFixed(1))+' דפים');
    const ref=x=>(x>>1)+(x&1?'b':'a');
    links=books.map(g=>{const k=T.BAVLI[g.b][1]; if(k.startsWith('Jerusalem')) return {label:nm(g.b),url:sef(k)};
      return {label:nm(g.b),url:sef(k+'.'+ref(g.a.x0)+(g.z.x1!==g.a.x0?'-'+ref(g.z.x1):''))}});
  } else if(kind==='rambam'){
    const nm=i=>T.RAMBAM[i][0], sh=i=>nm(i).replace(/^הלכות /,'');
    text=a.b===z.b?nm(a.b)+' '+(a.c===z.c?'פרק '+gem(a.c):'פרקים '+gem(a.c)+'–'+gem(z.c)):sh(a.b)+' '+gem(a.c)+' – '+sh(z.b)+' '+gem(z.c);
    meta=w===1?'פרק אחד':w+' פרקים';
    links=books.map(g=>({label:sh(g.b),url:sef('Mishneh_Torah,_'+T.RAMBAM[g.b][1].replace(/ /g,'_')+'.'+g.a.c+(g.z.c!==g.a.c?'-'+g.z.c:''))}));
  } else if(kind==='sa'){
    const nm=i=>T.SA[i][0], sh=i=>T.SA[i][1];
    text=a.b===z.b?nm(a.b)+' '+(a.c===z.c?'סימן '+gem(a.c):'סימנים '+gem(a.c)+'–'+gem(z.c)):sh(a.b)+' '+gem(a.c)+' – '+sh(z.b)+' '+gem(z.c);
    meta=w===1?'סימן אחד':w+' סימנים';
    links=books.map(g=>({label:sh(g.b),url:sef('Shulchan_Arukh,_'+T.SA[g.b][2]+'.'+g.a.c+(g.z.c!==g.a.c?'-'+g.z.c:''))}));
  }
  return {text,meta,links};
}
function trackList(cfg){
  const out=[];
  for(const t of cfg.tracks){
    const mode=t.kind==='tanakh'?(t.mode||(t.split?'split':'seq')):'';
    if(mode==='split'){out.push({kind:'torah',o:{}});out.push({kind:'nach',o:{}});}
    else if(mode==='parasha'){out.push({kind:'parasha',o:{}});out.push({kind:'nach',o:{}});}
    else if(mode==='nach') out.push({kind:'nach',o:{}});
    else out.push({kind:t.kind,o:t});
  }
  return out.sort((x,y)=>ORDER.indexOf(x.kind)-ORDER.indexOf(y.kind)).map(t=>({...t,key:KEY[t.kind],label:KIND[t.kind].label}));
}
function studyDates(cfg){
  const out=[],s=parse(cfg.start),e=parse(cfg.end),dows=cfg.dows&&cfg.dows.length?cfg.dows:[0,1,2,3,4,5,6];
  for(let d=s;d<=e;d=addDays(d,1)) if(dows.includes(d.getDay())) out.push(d);
  return out;
}
const ALN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שביעי'];
function parashaFor(dt){
  const PS=T.PARSHA, sat=addDays(dt,6-dt.getDay());
  const wi=Math.round((sat-parse(PS.start))/864e5/7);
  if(wi<0||wi>=PS.weeks.length) return null;
  let c=PS.weeks[wi], review=false;
  if(c<0){ for(let j=wi-1;j>=0;j--) if(PS.weeks[j]>=0){c=PS.weeks[j];review=true;break;} if(c<0) return null; }
  return {p:PS.P[c],review};
}
function parashaItem(dt,dows){
  const r=parashaFor(dt);
  if(!r) return {rest:true,text:'אין נתוני פרשה לתאריך הזה',meta:'',links:[]};
  const wd=dt.getDay(), sw=[0,1,2,3,4,5,6].filter(x=>dows.includes(x)), pos=sw.indexOf(wd);
  const from=pos>0?sw[pos-1]+1:0, to=pos===sw.length-1?6:wd;
  const [name,book,A]=r.p, a=A[from], z=A[to];
  const lab=from===to?ALN[from]:ALN[from]+' עד '+ALN[to];
  const bk=T.TANAKH[book], ref=bk[1]+'.'+a[0]+'.'+a[1]+'-'+(a[0]===z[2]?z[3]:z[2]+'.'+z[3]);
  return {text:(r.review?'חזרה: ':'')+'פרשת '+name+' · '+lab,
    meta:bk[0]+' '+gem(a[0])+','+gem(a[1])+' – '+gem(z[2])+','+gem(z[3])+(r.review?' · שבוע בלי פרשה, חוזרים על הקודמת':''),
    links:[{label:'פרשת '+name,url:sef(ref)}]};
}
function buildPlan(cfg){
  const dates=studyDates(cfg), N=dates.length, tracks=trackList(cfg);
  const dows=cfg.dows&&cfg.dows.length?cfg.dows:[0,1,2,3,4,5,6];
  const per=tracks.map(t=>{if(t.kind==='parasha') return {t,par:true}; const us=buildUnits(t.kind,t.o,N);return {t,us,al:alloc(us.map(x=>x.w),N)}});
  const sunday0=addDays(parse(cfg.start),-parse(cfg.start).getDay());
  const days=dates.map((dt,i)=>{
    const items={};
    for(const p of per){ if(p.par){ items[p.t.key]=parashaItem(dt,dows); continue; } const r=p.al[i]; items[p.t.key]=r?describe(p.t.kind,p.us.slice(r[0],r[1]+1)):{rest:true,text:'אין חומר חדש היום · זמן להשלמה או חזרה',meta:'',links:[]};}
    return {d:iso(dt),h:hdate(dt),dow:DOW[dt.getDay()],n:i+1,w:Math.floor((dt-sunday0)/864e5/7)+1,items};
  });
  return {tracks:tracks.map(t=>({key:t.key,kind:t.kind,label:t.label})),days};
}

const SEFM={'ברכות':'Berakhot','פאה':'Peah','דמאי':'Demai','כלאיים':'Kilayim','שביעית':'Sheviit','תרומות':'Terumot','מעשרות':'Maasrot','מעשר שני':'Maaser_Sheni','חלה':'Challah','ערלה':'Orlah','ביכורים':'Bikkurim','שבת':'Shabbat','עירובין':'Eruvin','פסחים':'Pesachim','שקלים':'Shekalim','יומא':'Yoma','סוכה':'Sukkah','ביצה':'Beitzah','ראש השנה':'Rosh_Hashanah','תענית':'Taanit','מגילה':'Megillah','מועד קטן':'Moed_Katan','חגיגה':'Chagigah','יבמות':'Yevamot','כתובות':'Ketubot','נדרים':'Nedarim','נזיר':'Nazir','סוטה':'Sotah','גיטין':'Gittin','קידושין':'Kiddushin','בבא קמא':'Bava_Kamma','בבא מציעא':'Bava_Metzia','בבא בתרא':'Bava_Batra','סנהדרין':'Sanhedrin','מכות':'Makkot','שבועות':'Shevuot','עדויות':'Eduyot','עבודה זרה':'Avodah_Zarah','אבות':'Avot','הוריות':'Horayot','זבחים':'Zevachim','מנחות':'Menachot','חולין':'Chullin','בכורות':'Bekhorot','ערכין':'Arakhin','תמורה':'Temurah','כריתות':'Keritot','מעילה':'Meilah','תמיד':'Tamid','מידות':'Middot','קינים':'Kinnim','כלים':'Kelim','אהלות':'Oholot','נגעים':'Negaim','פרה':'Parah','טהרות':'Tahorot','מקוואות':'Mikvaot','נידה':'Niddah','מכשירין':'Makhshirin','זבים':'Zavim','טבול יום':'Tevul_Yom','ידיים':'Yadayim','עוקצין':'Oktzin'};
const GV={'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ל':30,'מ':40,'נ':50,'ס':60,'ע':70,'פ':80,'צ':90,'ק':100};
const ungem=t=>[...t].reduce((a,c)=>a+(GV[c]||0),0);
function legacyLinks(str){
  const out=[];
  String(str).split('|').forEach(seg=>{
    const parts=seg.trim().split(' - '); if(parts.length!==2) return;
    const L=parts[0].trim(),R=parts[1].trim(),li=L.lastIndexOf(' '),ri=R.lastIndexOf(' ');
    const n1=L.slice(0,li),p1=L.slice(li+1),n2=ri>0?R.slice(0,ri):n1,p2=R.slice(ri+1);
    const e1=SEFM[n1],e2=SEFM[n2]; if(!e1||!e2) return;
    const [c1,m1]=p1.split(',').map(ungem),[c2,m2]=p2.split(',').map(ungem);
    const pre=e=>(e==='Avot'?'Pirkei_Avot':'Mishnah_'+e);
    if(n1===n2) out.push({label:n1,url:sef(pre(e1)+'.'+c1+'.'+m1+'-'+(c1===c2?m2:c2+'.'+m2))});
    else {out.push({label:n1,url:sef(pre(e1)+'.'+c1+'.'+m1)});out.push({label:n2,url:sef(pre(e2)+'.1.1-'+c2+'.'+m2)});}
  });
  return out;
}
function legacyPlan(p){
  return {
    tracks:[{key:'t',kind:'torah',label:'תורה'},{key:'n',kind:'nach',label:'נ״ך'},{key:'m',kind:'mishnah',label:'משניות'}],
    days:p.days.map(d=>({d:d.d,h:d.h,dow:d.dow,n:d.n,w:d.w,items:{
      t:{text:d.torah,meta:'',links:(d.tl||[]).map(l=>({label:l.label,url:sef(l.ref)}))},
      n:{text:d.nach,meta:d.nachType,links:(d.nl||[]).map(l=>({label:l.label,url:sef(l.ref)}))},
      m:{text:d.m,meta:(d.seder==='חזרה'?'חזרה שבועית':'סדר '+d.seder)+' · '+d.cnt+' משניות',links:legacyLinks(d.m)}}})),
    notes:p.notes||[]
  };
}

function getBuilt(id){

  const k=JSON.stringify(p.cfg);

const normL=c=>{c=c||{};return {m:!!c.m,t:!!c.t,n:c.n===undefined?!!c.t:!!c.n}};
function checksFor(id){ return id==='legacy'?S.legacyChecks:((S.plans[id]&&S.plans[id].checks)||{}); }
function isDone(id,date,key){ const c=checksFor(id)[date]; if(id==='legacy') return normL(c)[key]; return !!(c&&c[key]); }
function localPlans(){ let o={}; try{o=JSON.parse(ls.get('lu-plans')||'{}')||{}}catch(e){} for(const k in o) o[k].local=true; return o; }
function saveLocal(){ const o={}; for(const [k,v] of Object.entries(S.plans)) if(v.local) o[k]={cfg:v.cfg,checks:v.checks||{}}; ls.set('lu-plans',JSON.stringify(o)); }
const queues={};
function enqueue(id,fn){ queues[id]=(queues[id]||Promise.resolve()).then(fn,fn); return queues[id]; }
function planRef(id){ return S.db.collection('data/users/'+S.uid).doc('plan-'+id); }

async function setCheck(id,date,key,val){
  if(id==='legacy'){
    if(!S.db) return;
    const prev=S.legacyChecks[date]||{}, next=Object.assign({},prev,normL(prev),{[key]:val,updated:new Date().toISOString()});
    S.legacyChecks[date]=next; renderBoard();
    try{await S.db.collection('checks').doc(date).set(next); flash('נשמר');}
    catch(e){S.legacyChecks[date]=prev; renderBoard(); flash('לא הצלחתי לשמור את הסימון. נסה שוב.');}
    return;
  }
  const p=S.plans[id]; if(!p) return;
  p.checks=p.checks||{}; const prev=Object.assign({},p.checks[date]||{});
  p.checks[date]=Object.assign({},prev,{[key]:val}); renderBoard();
  if(p.local){saveLocal(); flash('נשמר'); return;}
  try{ await enqueue(id,()=>planRef(id).update({checks:{[date]:{[key]:val}}})); flash('נשמר'); }
  catch(e){ p.checks[date]=prev; renderBoard(); flash(e&&e.code==='invalid_argument'?'אין לך הרשאה לשמור. בקש מבעל הדף הרשאת משתתף.':'לא הצלחתי לשמור את הסימון. נסה שוב.'); }
}
async function createPlan(cfg){
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  cfg.created=new Date().toISOString();
  S.plans[id]={cfg,checks:{}};
  if(S.mode==='remote'&&!S.forceLocal){
    try{ await planRef(id).set({cfg,checks:{}}); }
    catch(e){
      if(e&&e.code==='invalid_argument'){ S.forceLocal=true; S.plans[id].local=true; saveLocal(); }
      else { delete S.plans[id]; flash('לא הצלחתי לשמור את התכנית. נסה שוב.'); render(); return; }
    }
  } else { S.plans[id].local=true; saveLocal(); }
  openPlan(id);
}
async function deletePlan(id){
  const keep=S.plans[id]; delete S.plans[id]; delete builtCache[id];

function progressOf(item){

  for(const d of b.days) for(const t of b.tracks){ if(d.items[t.key].rest) continue; tot++; if(isDone(item.id,d.d,t.key)) done++; }
  return tot?Math.round(done/tot*100):0;
}

const IN_CLAUDE=!!(window.claude&&window.claude.use);
const APP_URL=IN_CLAUDE?'':location.href.split('#')[0].split('?')[0];
const BYDAY=['SU','MO','TU','WE','TH','FR','SA'];
const ymd=s=>s.replace(/-/g,'');
function remindTime(){ return ls.get('lu-remind-time')||'20:00'; }
function dayLine(b,d){ return b.tracks.filter(t=>!d.items[t.key].rest).map(t=>t.label+': '+d.items[t.key].text).join(' · '); }
function gcalUrl(item,b){
  const tm=remindTime().replace(':','')+'00';
  const first=b.days.find(d=>d.d>=todayISO)||b.days[b.days.length-1];
  const hh=+tm.slice(0,2), mm=+tm.slice(2,4); const endM=hh*60+mm+30;
  const endT=pad(Math.floor(endM/60)%24)+pad(endM%60)+'00';
  const dows=(item.cfg.dows&&item.cfg.dows.length?item.cfg.dows:[0,1,2,3,4,5,6]).map(i=>BYDAY[i]).join(',');
  let tz='Asia/Jerusalem'; try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
  const det='הלימוד של היום מחכה בלוח'+(APP_URL?':\n'+APP_URL:'.');
  const q=new URLSearchParams({action:'TEMPLATE',text:'לימוד יומי · '+item.cfg.name,details:det,
    dates:ymd(first.d)+'T'+tm+'/'+ymd(first.d)+'T'+endT,ctz:tz,recur:'RRULE:FREQ=WEEKLY;BYDAY='+dows+';UNTIL='+ymd(item.cfg.end)+'T235959Z'});
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){ const enc=new TextEncoder(); if(enc.encode(line).length<=74) return line;
  const out=[]; let cur=''; for(const ch of line){ if(enc.encode(cur+ch).length>(out.length?73:74)){ out.push(cur); cur=ch; } else cur+=ch; } out.push(cur); return out.join('\r\n '); }
function buildIcs(item,b,range,alarmMin){
  const tm=remindTime().replace(':','')+'00'; const hh=+tm.slice(0,2), mm=+tm.slice(2,4); const endM=hh*60+mm+30;
  const endT=pad(Math.floor(endM/60)%24)+pad(endM%60)+'00';
  const lim=range==='all'?'9999-12-31':iso(addDays(parse(todayISO),range==='3m'?92:31));
  const days=b.days.filter(d=>d.d>=todayISO&&d.d<=lim&&b.tracks.some(t=>!d.items[t.key].rest));
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Luach Limud//HE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('לימוד יומי · '+item.cfg.name)];
  for(const d of days){
    const desc=b.tracks.filter(t=>!d.items[t.key].rest).map(t=>{const it=d.items[t.key];return t.label+': '+it.text+(it.links&&it.links[0]?'\n'+it.links[0].url:'');}).join('\n\n')+(APP_URL?'\n\n'+APP_URL:'');
    L.push('BEGIN:VEVENT','UID:'+item.id+'-'+d.d+'@luachlimud','DTSTAMP:'+stamp,'DTSTART:'+ymd(d.d)+'T'+tm,'DTEND:'+ymd(d.d)+'T'+endT,
      'SUMMARY:'+icsEsc('לימוד יומי · '+dayLine(b,d)),'DESCRIPTION:'+icsEsc(desc),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('לימוד יומי'),'TRIGGER:-PT'+alarmMin+'M','END:VALARM','END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return {text:L.map(icsFold).join('\r\n')+'\r\n',count:days.length};
}

    (IN_CLAUDE?'':'<div class="row" style="border-top:1px solid var(--line);padding-top:12px"><select id="rm-range" aria-label="טווח"><option value="1m">חודש קרוב</option><option value="3m" selected>3 חודשים</option><option value="all">עד סוף התכנית</option></select>'+
      '<select id="rm-alarm" aria-label="מתי להזכיר"><option value="0">בשעת הלימוד</option><option value="10">10 דקות לפני</option><option value="60">שעה לפני</option></select>'+
      '<button type="button" class="btn" id="rm-ics">הורדת קובץ יומן עם הלימוד של כל יום</button></div>'+
      '<p>בקובץ כל יום מופיע עם מה שלומדים בו וקישור לספריא. במחשב: ב-Google Calendar נכנסים להגדרות, ייבוא, ובוחרים את הקובץ. בטלפון: פותחים את הקובץ עם אפליקציית היומן.</p>')+
    '</details>';
}

function openPlan(id){ S.cur=id; S.view='board'; S.confirmDel=false; S.lateLast=''; ls.set('lu-last',id); const b=getBuilt(id); const i=todayIndex(b); S.week=b.days[i].w; render(); window.scrollTo(0,0); }
function todayIndex(b){
  let i=b.days.findIndex(d=>d.d>=todayISO);
  if(i<0) i=b.days.length-1;
  return i;
}
function missedList(b,id){ return b.days.filter(d=>d.d<todayISO&&b.tracks.some(t=>!d.items[t.key].rest&&!isDone(id,d.d,t.key))); }
function renderBoard(full){
  if(S.view!=='board') return;
  const id=S.cur, b=getBuilt(id); if(!b){S.view='home';render();return}
  const item=plansList().find(p=>p.id===id); if(!item){S.view='home';render();return}
  const canWrite=S.mode==='local'||!!S.db;
  const ti=todayIndex(b), d=b.days[ti], isToday=d.d===todayISO;
  const headLabel=isToday?'היום · ':(d.d>todayISO?(todayISO<b.days[0].d?'מתחילים ב':'הלימוד הבא · '):'היום האחרון · ');
  const links=(it,t)=>it.links&&it.links.length?'<div class="mlinks">'+it.links.map(l=>'<a class="openbtn" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+(it.links.length>1?esc(l.label):'פתח באפליקציה')+' <span aria-hidden="true">↗</span></a>').join('')+'</div>':'';
  const lk=it=>(it.links||[]).map(l=>' <a class="lk" href="'+esc(l.url)+'" target="_blank" rel="noopener" title="'+esc(l.label)+' בספריא" aria-label="פתח '+esc(l.label)+' בספריא">↗</a>').join('');
  const box=(date,t,big)=>'<input type="checkbox" class="chk" data-date="'+date+'" data-k="'+t.key+'" aria-label="'+esc(t.label)+' '+date+'"'+(isDone(id,date,t.key)?' checked':'')+(canWrite?'':' disabled')+'>';
  const todayHtml='<section class="today" id="sec-today" aria-live="polite"><div class="today-head"><h2>'+headLabel+'יום '+esc(d.dow)+', '+esc(d.h)+'</h2><span class="daynum">יום '+d.n+' מתוך '+b.days.length+' · שבוע '+d.w+'</span></div>'+
    b.tracks.map(t=>{const it=d.items[t.key];return '<div class="track'+(it.rest?' rest':'')+'" style="'+tv(t.kind)+'"><div><div class="lbl">'+esc(t.label)+'</div><div class="what">'+esc(it.text)+'</div>'+(it.meta?'<div class="meta">'+esc(it.meta)+'</div>':'')+links(it,t)+'</div>'+(it.rest?'':box(d.d,t,true))+'</div>'}).join('')+
    '<div class="status" id="status">'+esc(S.msg)+'</div></section>';
  let done={},tot=0,dn=0; b.tracks.forEach(t=>done[t.key]=[0,0]);
  for(const x of b.days) for(const t of b.tracks){ if(x.items[t.key].rest) continue; done[t.key][1]++; tot++; if(isDone(id,x.d,t.key)){done[t.key][0]++;dn++;} }
  const late=missedList(b,id).length;
  const stats='<section class="stats" aria-label="התקדמות">'+b.tracks.map(t=>'<div class="stat" style="'+tv(t.kind)+'"><b>'+done[t.key][0]+'</b><span>ימי '+esc(t.label)+' מתוך '+done[t.key][1]+'</span></div>').join('')+
    '<button type="button" class="stat" id="late-btn" aria-label="מעבר ליום שעבר ולא סומן"><b>'+late+'</b><span>ימים שעברו ולא סומנו</span></button>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+(tot?(dn/tot*100).toFixed(1):0)+'%"></i></div></section>';
  const lastW=b.days[b.days.length-1].w, firstW=b.days[0].w;
  const ds=b.days.filter(x=>x.w===S.week);
  const week='<section id="sec-week"><div class="weeknav"><button class="btn" id="prev" type="button"'+(S.week<=firstW?' disabled':'')+'>→ הקודם</button><h3>שבוע '+S.week+(ds.length?' · '+esc(ds[0].h)+' – '+esc(ds[ds.length-1].h):'')+'</h3><button class="btn" id="nextw" type="button"'+(S.week>=lastW?' disabled':'')+'>הבא ←</button></div>'+
    '<ul class="days">'+(ds.length?ds.map(x=>{const missed=x.d<todayISO&&b.tracks.some(t=>!x.items[t.key].rest&&!isDone(id,x.d,t.key));
      return '<li id="day-'+x.d+'" class="day'+(x.d===todayISO?' is-today':'')+(missed?' missed':'')+'"><div class="when"><b>'+esc(x.dow)+'</b>'+esc(x.h)+'</div><div class="lines">'+
        b.tracks.map(t=>{const it=x.items[t.key];return '<div class="line'+(it.rest?' rest':'')+'" style="'+tv(t.kind)+'"><span><span class="k">'+esc(t.label)+'</span>'+esc(it.rest?'השלמה':it.text)+(it.rest?'':lk(it))+'</span>'+(it.rest?'':box(x.d,t))+'</div>'}).join('')+'</div></li>'}).join(''):'<li class="day"><div></div><div class="sub">אין ימי לימוד בשבוע הזה.</div></li>')+'</ul>'+
    '<div style="text-align:center;margin-top:10px"><button class="btn" id="go-today" type="button">חזרה לשבוע הנוכחי</button></div></section>';
  const notes=item.legacy&&b.notes&&b.notes.length?'<details><summary>הערות ללוח</summary><ul>'+b.notes.map(n=>'<li>'+esc(n.replace(/^•\s*/,''))+'</li>').join('')+'</ul></details>':'';
  const del=item.legacy?'':'<div class="confirm">'+(S.confirmDel?'<span>למחוק את התכנית ואת כל הסימונים שלה?</span><button type="button" class="btn danger" id="del-yes">כן, למחוק</button><button type="button" class="btn" id="del-no">ביטול</button>':'<button type="button" class="btn ghost" id="del">מחיקת התכנית</button>')+'</div>';
  const y=window.scrollY;
  app.innerHTML='<header class="topbar"><div><h1>'+esc(item.cfg.name)+'</h1><p class="sub">'+esc(hdate(parse(item.cfg.start),true))+' – '+esc(hdate(parse(item.cfg.end),true))+'</p></div><button type="button" class="btn" id="home">התכניות שלי</button></header>'+
    (!canWrite?'<p class="notice">כדי לסמן וי צריך להיות מחובר.</p>':'')+
    todayHtml+remindCard(item,b)+stats+week+notes+del;
  if(!full) window.scrollTo(0,y);
  app.classList.add('has-tabbar');
  let tb=document.getElementById('tabbar');
  if(!tb){ tb=document.createElement('nav'); tb.id='tabbar'; tb.className='tabbar'; tb.setAttribute('aria-label','ניווט'); tb.dir='rtl'; document.body.appendChild(tb);
    tb.innerHTML='<button type="button" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>היום</button>'+
      '<button type="button" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>השבוע</button>'+
      '<button type="button" data-tab="plans"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></svg>התכניות</button>';
    tb.addEventListener('click',e=>{ const bt=e.target.closest('button'); if(!bt) return; const t=bt.dataset.tab;
      if(t==='plans'){ S.view='home'; render(); window.scrollTo(0,0); return; }
      if(t==='week'){ const bb=getBuilt(S.cur); if(bb){ S.week=bb.days[todayIndex(bb)].w; renderBoard(); } const w=document.getElementById('sec-week'); if(w) w.scrollIntoView({behavior:'smooth',block:'start'}); return; }
      window.scrollTo({top:0,behavior:'smooth'}); });
  }
  const setCur=()=>{ const w=document.getElementById('sec-week'); const inWeek=w&&w.getBoundingClientRect().top<window.innerHeight*0.45;
    tb.querySelectorAll('button').forEach(x=>x.setAttribute('aria-current',String((x.dataset.tab==='week')===!!inWeek&&x.dataset.tab!=='plans'))); };
  setCur(); window.onscroll=()=>{ if(S.view==='board') setCur(); };
  document.getElementById('home').onclick=()=>{S.view='home';render();window.scrollTo(0,0)};
  document.getElementById('prev').onclick=()=>{S.week--;renderBoard()};
  document.getElementById('nextw').onclick=()=>{S.week++;renderBoard()};
  document.getElementById('go-today').onclick=()=>{S.week=b.days[todayIndex(b)].w;renderBoard()};
  document.getElementById('late-btn').onclick=()=>{
    const ms=missedList(b,id);
    if(!ms.length){flash('אין ימים שעברו ולא סומנו 🎉');return}
    const x=ms.find(m=>m.d>S.lateLast)||ms[0]; S.lateLast=x.d; S.week=x.w; renderBoard();
    const li=document.getElementById('day-'+x.d);
    if(li){li.scrollIntoView({behavior:'smooth',block:'center'});li.classList.add('flash');setTimeout(()=>li.classList.remove('flash'),1700);}
    flash('יום '+x.dow+' '+x.h+' ('+(ms.indexOf(x)+1)+' מתוך '+ms.length+') · לחץ שוב לבא');
  };
  const rm=document.getElementById('remind'); if(rm) rm.ontoggle=()=>{S.remindOpen=rm.open};
  const rt=document.getElementById('rm-time'); if(rt) rt.onchange=()=>{ if(rt.value){ ls.set('lu-remind-time',rt.value); document.getElementById('rm-gcal').href=gcalUrl(item,b); } };
  const ri=document.getElementById('rm-ics'); if(ri) ri.onclick=()=>{
    const r=buildIcs(item,b,document.getElementById('rm-range').value,+document.getElementById('rm-alarm').value);
    if(!r.count){ flash('אין ימי לימוד בטווח הזה'); return; }
    const url=URL.createObjectURL(new Blob([r.text],{type:'text/calendar;charset=utf-8'}));
    const a=document.createElement('a'); a.href=url; a.download='luach-limud.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    flash('ירד קובץ יומן עם '+r.count+' ימי לימוד');
  };
  const dl=document.getElementById('del'); if(dl) dl.onclick=()=>{S.confirmDel=true;renderBoard()};
  const dn2=document.getElementById('del-no'); if(dn2) dn2.onclick=()=>{S.confirmDel=false;renderBoard()};
  const dy=document.getElementById('del-yes'); if(dy) dy.onclick=()=>deletePlan(id);
}
app.addEventListener('change',e=>{
  const el=e.target; if(!el.classList||!el.classList.contains('chk')||!el.dataset.date||S.view!=='board') return;
  if(el.checked){ try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} }
  setCheck(S.cur,el.dataset.date,el.dataset.k,el.checked);
});

/* ---------- Boot ---------- */
function afterLoad(){
  if(S.view!=='loading'&&S.view!=='home') { if(S.view==='board') renderBoard(); return; }
  const last=ls.get('lu-last'), l=plansList();
  if(S.view==='loading'&&last&&l.some(p=>p.id===last)) return openPlan(last);
  S.view='home'; render();
}
function goLocal(){
  S.mode='local'; S.plans=localPlans();
  afterLoad();
}
let booted=false;
async function boot(){
  if(!(window.claude&&claude.use)){ goLocal(); return; }
  const [db,user]=await Promise.all([claude.use('db').catch(()=>null),claude.use('user').catch(()=>null)]);
  if(booted) return; booted=true;
  if(!db||!user){ goLocal(); return; }
  const uid=await user.id().catch(()=>null);
  if(!uid){ goLocal(); return; }
  S.db=db; S.user=user; S.uid=uid; S.mode='remote';
  S.owner=await user.isOwner().catch(()=>false);
  let gotPlans=false, gotLegacy=!S.owner;
  const ready=()=>{ if(gotPlans&&gotLegacy) afterLoad(); };
  db.collection('data/users/'+uid).limit(200).onSnapshot(snap=>{
    const m={};
    snap.docs.forEach(doc=>{ if(doc.id.startsWith('plan-')){const v=doc.data()||{}; if(v.cfg) m[doc.id.slice(5)]={cfg:v.cfg,checks:v.checks||{}};} });
    S.plans=Object.assign(localPlans(),m); gotPlans=true; if(S.view==='loading') ready(); else if(S.view==='home'||S.view==='board') render();
  },()=>{ flash('התכניות לא נטענו כרגע. רענן את הדף.'); gotPlans=true; ready(); });
  if(S.owner){
    fetch('plan.json').then(r=>r.ok?r.json():null).then(p=>{
      if(p&&p.days&&p.days.length){
        S.legacy=p;
        db.collection('checks').limit(1000).onSnapshot(snap=>{
          const m={}; snap.docs.forEach(doc=>{m[doc.id]=doc.data()||{}}); S.legacyChecks=m;
          if(!gotLegacy){gotLegacy=true;ready();} else if(S.view==='board'||S.view==='home') render();
        },()=>{gotLegacy=true;ready();});
      } else {gotLegacy=true;ready();}
    }).catch(()=>{gotLegacy=true;ready();});
  }
}
goLocal();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
